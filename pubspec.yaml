name: previsao_tempo
description: Aplicativo Flutter para consulta de previsão do tempo de cidades brasileiras utilizando dados XML do CPTEC/INPE.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.3.1
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
